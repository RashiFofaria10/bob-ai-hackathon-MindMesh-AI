submission:
  title: "ChainGuard AI"                                   # REQUIRED

  problem_statement: >                                    # REQUIRED
    Supply chain disruptions such as weather events, port strikes, and
    geopolitical crises can affect hundreds of active shipments and are
    difficult to track manually. Fleet assets such as trucks, containers,
    and vessels can remain idle while other routes become overloaded.
    Cold-chain shipments such as vaccines and perishables are especially
    vulnerable because a temperature excursion can spoil high-value cargo
    before the breach is discovered.

  solution_summary: >                                      # REQUIRED
    ChainGuard AI is an AI-powered supply-chain control tower that identifies
    disruption-affected shipments, evaluates shipment risk, and recommends
    alternative routes and carriers. It also matches idle fleet vehicles to
    urgent shipments and monitors cold-chain temperature data to detect
    excursions and classify their severity, with IBM Bob providing a
    conversational AI interface for supply-chain decision support.

  key_features:                                            # REQUIRED
    - "Disruption Impact Analysis: Identifies shipments affected by active disruptions and determines their level of risk."
    - "AI Shipment Risk Assessment: Calculates shipment risk using disruption severity, route exposure, delay, cargo sensitivity, and delivery urgency."
    - "Route & Carrier Recommendations: Recommends safer alternative routes and suitable carriers by comparing risk, cost, and estimated travel time."
    - "Idle Fleet Redeployment: Identifies available idle vehicles and matches them with affected shipments based on location, capacity, vehicle type, and cargo requirements."
    - "Cold-Chain Monitoring: Analyzes temperature logs for temperature-sensitive shipments and detects abnormal temperature excursions."
    - "Severity Classification: Classifies detected cold-chain excursions according to the severity rules implemented in the system."
    - "AI Recommendations: Converts detected risks and available resources into actionable operational recommendations."
    - "IBM Bob Assistant: Allows users to ask natural-language questions about disruptions, shipment risks, fleet availability, recommendations, and cold-chain alerts."

  tech_stack:
    languages:
      - "TypeScript"
      - "JavaScript"

    frameworks:
      - "Next.js"
      - "React"
      - "Tailwind CSS"
      - "Express.js"

    ibm_technologies:
      - "IBM Bob"

    databases:
      - "MongoDB"
      - "Mongoose"

    other:
      - "shadcn/ui"
      - "Base UI React"
      - "Recharts"
      - "Lucide React"
      - "PostCSS"
      - "pnpm"
      - "Vercel Analytics"
      - "REST APIs"
      - "Git"
      - "GitHub"
      - "Environment Variables"

  what_we_are_most_proud_of: >                            # Optional
    We are most proud of bringing multiple supply-chain intelligence
    capabilities into one integrated decision-support platform. ChainGuard AI
    connects disruption impact analysis, shipment risk assessment, route and
    carrier recommendations, idle fleet redeployment, and cold-chain monitoring
    into a single workflow, while IBM Bob provides a natural-language interface
    through which users can understand risks and obtain actionable
    recommendations.

  known_limitations: >                                    # Optional
    The prototype uses simulated supply-chain, fleet, disruption, and
    temperature data rather than live enterprise logistics and IoT data.
    Route, carrier, and fleet recommendations are designed as a prototype
    decision-support mechanism and may require additional constraints and
    optimization for production deployment. Cold-chain severity
    classification depends on the thresholds and rules configured in the
    prototype.

